<!-- ================= HERO ================= -->

<section class="hero hero-small">

<div class="container text-center">

<h1 class="display-4 fw-bold">

Browse Our Collection

</h1>

<p class="lead mt-3">

Discover premium wall posters for every space.

</p>

</div>

</section>

<!-- ================= FILTER BAR ================= -->

<section class="py-5">

<div class="container">

<div class="row g-3 align-items-center">

<div class="col-lg-6">

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-search"></i>

</span>

<input
id="searchInput"
type="text"
class="form-control"

placeholder="Search posters...">

</div>

</div>

<div class="col-lg-3">

<select
id="sortSelect"
class="form-select">

<option value="latest">Newest</option>

<option value="az">Name A-Z</option>

<option value="za">Name Z-A</option>

<option value="low">Price Low → High</option>

<option value="high">Price High → Low</option>

</select>

</div>

<div class="col-lg-3 text-lg-end">

<h6 class="mb-0">

<span id="posterCount">

0

</span>

Posters Found

</h6>

</div>

</div>

</div>

</section>

<!-- ================= CATEGORY FILTER ================= -->

<section class="pb-5">

<div class="container">

<div class="category-filter d-flex flex-wrap gap-2 justify-content-center">

<button class="btn btn-primary category-btn active"

data-category="All">

All

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Anime">

Anime

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Gaming">

Gaming

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Movies">

Movies

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Marvel">

Marvel

</button>

<button class="btn btn-outline-primary category-btn"

data-category="DC">

DC

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Cars">

Cars

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Music">

Music

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Sports">

Sports

</button>

<button class="btn btn-outline-primary category-btn"

data-category="Nature">

Nature

</button>

</div>

</div>

</section>

<!-- ================= POSTER GRID ================= -->

<section class="pb-5">

<div class="container">

<div
id="posterContainer"
class="row g-4">

<!-- Cards generated by posters.js -->

</div>

</div>

</section>

<!-- ================= LOAD MORE ================= -->

<section class="pb-5">

<div class="container text-center">

<button
id="loadMoreBtn"

class="btn btn-primary btn-lg rounded-pill px-5">

Load More

</button>

</div>

</section>

<!-- ================= LOADER ================= -->

<div
id="loading"

class="text-center py-5 d-none">

<div class="spinner-border text-primary"></div>

<p class="mt-3">

Loading Posters...

</p>

</div>
